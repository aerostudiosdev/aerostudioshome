<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AeroStudios – Unabhängiges iOS-Studio</title>
  <meta name="description" content="AeroStudios entwickelt iOS-Apps. Hier findest du AeroBooks, AeroMovies sowie Datenschutz und Support." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f2f4f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <script src="./assets/js/theme-init.js"></script>
</head>
<body data-root="./" data-page="home" data-title="title.home" data-desc="desc.home">
  <noscript><div class="container"><div class="noscript-box"><p lang="de">Diese Seite benötigt JavaScript, um Texte und Sprachen anzuzeigen. Bitte aktiviere JavaScript.</p><p lang="en">This page needs JavaScript to display its text and languages. Please enable JavaScript.</p><p lang="fr">Cette page nécessite JavaScript pour afficher ses textes et ses langues. Veuillez activer JavaScript.</p></div></div></noscript>

  <main id="main">
    <section class="hero">
      <div class="container">
        <span class="eyebrow glass reveal" data-i18n="home.eyebrow"></span>
        <h1 class="reveal" style="--i:1" data-i18n="home.title"></h1>
        <p class="lead reveal" style="--i:2" data-i18n="home.lead"></p>
        <div class="hero-actions reveal" style="--i:3">
          <a class="btn btn-primary" href="#projects" data-i18n="btn.projects"></a>
          <a class="btn btn-glass" href="#contact" data-i18n="btn.contact"></a>
        </div>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.projects.title"></h2>
          <p data-i18n="home.projects.sub"></p>
        </div>
        <!-- Karten werden aus assets/js/projects.js erzeugt – neue Apps dort eintragen -->
        <div class="grid grid-2" data-projects></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="card glass">
          <h2 data-i18n="home.about.title"></h2>
          <p data-i18n="home.about.text"></p>
        </div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container">
        <div class="card glass">
          <h2 data-i18n="home.contact.title"></h2>
          <p data-i18n="home.contact.text"></p>
          <div class="info-list">
            <div class="info-item">
              <strong data-i18n="home.contact.label"></strong>
              <a data-mailto data-mailto-text href="#"></a>
            </div>
          </div>
          <div class="actions">
            <a class="btn btn-primary" data-mailto href="#"><span class="btn-ic" data-icon="mail"></span><span data-i18n="btn.email"></span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./assets/i18n/site.js"></script>
  <script src="./assets/js/projects.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
