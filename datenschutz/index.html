<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Datenschutzerklärung (Website) | AeroStudios</title>
  <meta name="description" content="Datenschutzerklärung für die Website von AeroStudios." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f2f4f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="../assets/js/theme-init.js"></script>
</head>
<body data-root="../" data-page="site-privacy" data-title="title.sitePrivacy" data-desc="desc.sitePrivacy">
  <noscript><div class="container"><div class="noscript-box"><p lang="de">Diese Seite benötigt JavaScript, um Texte und Sprachen anzuzeigen. Bitte aktiviere JavaScript.</p><p lang="en">This page needs JavaScript to display its text and languages. Please enable JavaScript.</p><p lang="fr">Cette page nécessite JavaScript pour afficher ses textes et ses langues. Veuillez activer JavaScript.</p></div></div></noscript>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <div class="page-hero-card glass reveal">
          <span class="eyebrow" data-doc-hero="site.privacy.eyebrow"></span>
          <h1 data-doc-hero="site.privacy.title"></h1>
          <p data-doc-hero="site.privacy.lead"></p>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="container">
        <div class="notice-wrap">
          <div class="notice glass reveal" style="--i:1" role="note">
            <span data-icon="info"></span>
            <p data-i18n="notice.legal"></p>
          </div>
        </div>
        <article class="content-card glass glass-strong reveal" style="--i:2">
          <div class="doc" data-doc="site.privacy"></div>
          <div class="quick-links">
            <a class="btn btn-glass" href="../impressum/"><span class="btn-ic" data-icon="info"></span><span data-i18n="footer.imprint"></span></a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="../assets/i18n/site.js"></script>
  <script src="../assets/i18n/site-legal.js"></script>
  <script src="../assets/js/projects.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
